<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;

const fmt$ = (v) => v ? `$${parseFloat(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}` : "—";
const C = { bg: "#F4F5F7", card: "#FFFFFF", border: "#E2E4E9", borderLight: "#ECEDF0", text: "#1A1D23", textSec: "#5F6368", textMuted: "#9AA0A6", green: "#0D9F61", greenBg: "#E6F7EF", yellow: "#D97706", yellowBg: "#FEF9E7", red: "#DC2626", redBg: "#FEF2F2", blue: "#2563EB", blueBg: "#EFF6FF", accent: "#1A1D23" };
const MKT = { alcista: { label: "Alcista", emoji: "📈", delta: [25,30], tp: "Escalonado 10→50%", asset: "SSO", bpMax: 40, color: C.green }, lateral: { label: "Lateral", emoji: "➡️", delta: [16,20], tp: "50% fijo", asset: "SPYM/SPY", bpMax: 40, color: C.blue }, bajista: { label: "Bajista", emoji: "📉", delta: [10,16], tp: "25%", asset: "SPYM", bpMax: 25, color: C.yellow }, crash: { label: "Crash", emoji: "💥", delta: null, tp: "NO OPERAR", asset: "—", bpMax: 0, color: C.red } };

const P1 = `Analiza esta captura del Quick Chart/panel lateral de Tastytrade. Responde SOLO JSON puro sin markdown:
{"asset":"ticker","precio":number,"chg":number,"ivRank":number,"ivInd":number_o_null,"stars":number_1a5_o_null,"volumen":"string_o_null"}`;
const P2 = `Analiza esta captura del chart ampliado de Tastytrade con SMA50,SMA200,VWAP. Responde SOLO JSON puro:
{"tendencia":"alcista"_o_"lateral"_o_"bajista","netLiq":number_o_null,"bp":number_o_null,"plDay":number_o_null,"plYtd":number_o_null}`;
const P3 = `Analiza esta captura de cadena de opciones de Tastytrade con strike seleccionado. Responde SOLO JSON puro:
{"asset":"ticker","dte":number,"ivx":number,"em":number,"strike":number,"bid":number,"ask":number,"ror":number_o_null,"delta":number,"p50":number,"pop":number,"theta":number,"maxProfit":number,"bpEff":number,"contract":"mensual"_o_"weekly"_o_"trimestral","bp":number_o_null,"netLiq":number_o_null}`;

const sc = {
  market: v => { if(!v) return {pts:0,max:.5,level:"—",color:C.textMuted,reason:""}; if(v==="crash") return {pts:0,max:.5,level:"BLOQUEANTE",color:C.red,reason:"Crash — NO OPERAR.",blocker:true}; if(v==="alcista"||v==="lateral") return {pts:.5,max:.5,level:"ÓPTIMO",color:C.green,reason:v==="alcista"?"Alcista. ATM de Borja rinde mejor.":"Lateral. Theta income OTM 16-20."}; return {pts:.25,max:.5,level:"ACEPTABLE",color:C.yellow,reason:"Bajista. Delta bajo, BP≤25%, TP 25%."}; },
  chg: v => { const n=parseFloat(v); if(isNaN(n)) return {pts:0,max:.5,level:"—",color:C.textMuted,reason:""}; if(n<=-.5) return {pts:.5,max:.5,level:"ÓPTIMO",color:C.green,reason:`Día rojo ${n.toFixed(2)}%. +25% P&L medio (Tastylive).`}; if(n<.5) return {pts:.25,max:.5,level:"BUENO",color:C.green,reason:`${n>=0?"+":""}${n.toFixed(2)}%. Neutro.`}; return {pts:0,max:.5,level:"MALO",color:C.red,reason:`Verde +${n.toFixed(2)}%. Primas bajas.`}; },
  stars: v => { const n=parseInt(v); if(isNaN(n)||n===0) return {pts:0,max:.5,level:"—",color:C.textMuted,reason:""}; if(n<=1) return {pts:0,max:.5,level:"BLOQUEANTE",color:C.red,reason:"1⭐ sin liquidez. NO OPERAR.",blocker:true}; if(n===2) return {pts:.125,max:.5,level:"MALO",color:C.red,reason:"2⭐ liquidez baja."}; if(n===3) return {pts:.35,max:.5,level:"ACEPTABLE",color:C.yellow,reason:"3⭐ liquidez aceptable (SPYM suele estar aquí)."}; return {pts:.5,max:.5,level:"ÓPTIMO",color:C.green,reason:"4⭐ máxima liquidez (SPY, GOOG, AAPL)."}; },
  ivRank: v => { const n=parseFloat(v); if(isNaN(n)) return {pts:0,max:.75,level:"—",color:C.textMuted,reason:""}; if(n>=50) return {pts:.75,max:.75,level:"ÓPTIMO",color:C.green,reason:`IVR ${n.toFixed(0)}% excepcional. Primas infladas.`}; if(n>=30) return {pts:.5,max:.75,level:"BUENO",color:C.green,reason:`IVR ${n.toFixed(0)}% bueno. Tastylive: "above 30 = good selling".`}; if(n>=20) return {pts:.25,max:.75,level:"ACEPTABLE",color:C.yellow,reason:`IVR ${n.toFixed(0)}% moderado. Aceptable si IVx compensa.`}; return {pts:0,max:.75,level:"MALO",color:C.red,reason:`IVR ${n.toFixed(0)}% bajo. P&L≈0 (Tastylive, 12 años).`}; },
  ivx: v => { const n=parseFloat(v); if(isNaN(n)) return {pts:0,max:.75,level:"—",color:C.textMuted,reason:""}; if(n>=50) return {pts:.75,max:.75,level:"ÓPTIMO",color:C.green,reason:`IVx ${n.toFixed(1)}% muy alta. Primas jugosas.`}; if(n>=35) return {pts:.5,max:.75,level:"BUENO",color:C.green,reason:`IVx ${n.toFixed(1)}% buena volatilidad.`}; if(n>=20) return {pts:.25,max:.75,level:"ACEPTABLE",color:C.yellow,reason:`IVx ${n.toFixed(1)}% normal.`}; return {pts:0,max:.75,level:"MALO",color:C.red,reason:`IVx ${n.toFixed(1)}% baja. Primas escasas.`}; },
  em: (p,e,s) => { const pp=parseFloat(p),ee=parseFloat(e),ss=parseFloat(s); if(isNaN(pp)||isNaN(ee)||isNaN(ss)) return {pts:0,max:0,level:"—",color:C.textMuted,reason:"",sug:null}; const limInf=(pp-ee).toFixed(1); const distStrike=(pp-ss).toFixed(1); const distEM=(ss-(pp-ee)).toFixed(1); if(ss<=pp-ee) return {pts:0,max:0,level:"INFO",color:C.green,reason:`El mercado espera que ${pp.toFixed(2)} se mueva ±${ee} hasta vencimiento → rango inferior: $${limInf}. Tu strike $${ss} está por debajo de ese límite (${Math.abs(parseFloat(distEM)).toFixed(1)} puntos más abajo). Colchón máximo: el precio tendría que caer más de lo esperado para llegar a tu strike.`,sug:limInf}; if(ss<pp) return {pts:0,max:0,level:"INFO",color:C.blue,reason:`El mercado espera que ${pp.toFixed(2)} se mueva ±${ee} hasta vencimiento → rango inferior: $${limInf}. Tu strike $${ss} está entre el precio actual y el límite del EM ($${distStrike} por debajo del precio, pero $${distEM} por encima del EM). Colchón normal: el delta ya refleja este riesgo.`,sug:limInf}; return {pts:0,max:0,level:"INFO",color:C.yellow,reason:`El mercado espera que ${pp.toFixed(2)} se mueva ±${ee} → rango inferior: $${limInf}. Tu strike $${ss} está muy cerca o por encima del precio. Revisa el delta.`,sug:limInf}; },
  dte: v => { const n=parseInt(v); if(isNaN(n)) return {pts:0,max:.5,level:"—",color:C.textMuted,reason:""}; if(n>=38&&n<=55) return {pts:.5,max:.5,level:"ÓPTIMO",color:C.green,reason:`${n}d zona óptima.`}; if(n>=25&&n<=65) return {pts:.25,max:.5,level:"ACEPTABLE",color:C.yellow,reason:`${n}d fuera ideal.`}; return {pts:0,max:.5,level:"MALO",color:C.red,reason:`${n}d ${n<25?"riesgo gamma":"theta lento"}.`}; },
  contract: v => { if(!v) return {pts:0,max:.5,level:"—",color:C.textMuted,reason:""}; if(v==="mensual") return {pts:.5,max:.5,level:"ÓPTIMO",color:C.green,reason:"Mensual estándar. Máxima liquidez. Regla Borja: solo mensuales puros."}; if(v==="weekly") return {pts:.25,max:.5,level:"ACEPTABLE",color:C.yellow,reason:"Weekly. Menor liquidez. Borja no los recomienda."}; return {pts:0,max:.5,level:"MALO",color:C.red,reason:"Trimestral. Evitar — liquidez reducida."}; },
  delta: (v,m) => { const n=Math.abs(parseFloat(v)); if(isNaN(n)) return {pts:0,max:2,level:"—",color:C.textMuted,reason:""}; if(n>35) return {pts:0,max:2,level:"BLOQUEANTE",color:C.red,reason:`Δ${n.toFixed(1)}>35. Apuesta direccional. NO OPERAR.`,blocker:true}; const c=MKT[m]; if(!c?.delta) return {pts:0,max:2,level:"—",color:C.textMuted,reason:""}; const [lo,hi]=c.delta; if(n>=lo&&n<=hi) return {pts:2,max:2,level:"ÓPTIMO",color:C.green,reason:`Δ${n.toFixed(1)} en rango ${c.label} (${lo}-${hi}). Perfecto.`}; if(m==="alcista"){if(n>=21&&n<=30) return {pts:2,max:2,level:"ÓPTIMO",color:C.green,reason:`Δ${n.toFixed(1)} zona Tastylive estándar para ${c.label}.`}; if(n>=16&&n<=20) return {pts:1,max:2,level:"ACEPTABLE",color:C.yellow,reason:`Δ${n.toFixed(1)} operable en alcista, pero más lento.`}; return {pts:0,max:2,level:"MALO",color:C.red,reason:`Δ${n.toFixed(1)} fuera rango ${c.label}.`};} if(m==="lateral"){if(n>=10&&n<=20) return {pts:2,max:2,level:"ÓPTIMO",color:C.green,reason:`Δ${n.toFixed(1)} zona óptima lateral.`}; if(n>=21&&n<=30) return {pts:1,max:2,level:"ACEPTABLE",color:C.yellow,reason:`Δ${n.toFixed(1)} zona Tastylive (21-30). Operable en lateral.`}; return {pts:0,max:2,level:"MALO",color:C.red,reason:`Δ${n.toFixed(1)} fuera rango lateral.`};} if(m==="bajista"){if(n>=10&&n<=20) return {pts:2,max:2,level:"ÓPTIMO",color:C.green,reason:`Δ${n.toFixed(1)} zona segura bajista.`}; if(n>=21&&n<=30) return {pts:1,max:2,level:"ACEPTABLE",color:C.yellow,reason:`Δ${n.toFixed(1)} aceptable pero menos colchón bajista.`}; return {pts:0,max:2,level:"MALO",color:C.red,reason:`Δ${n.toFixed(1)} demasiado alto para bajista.`};} return {pts:1,max:2,level:"ACEPTABLE",color:C.yellow,reason:`Δ${n.toFixed(1)} fuera del óptimo.`}; },
  liq: (oi,bid,ask) => { const b=parseFloat(bid),a=parseFloat(ask); if(isNaN(b)||isNaN(a)||b===0) return {pts:0,max:.5,level:"—",color:C.textMuted,reason:"",sp$:0,spPct:0}; const mid=(b+a)/2,spD=Math.abs(a-b),spPct=((a-b)/mid)*100,o=parseInt(oi); if(!isNaN(o)&&o<10) return {pts:0,max:.5,level:"BLOQUEANTE",color:C.red,reason:`OI=${o} (<10). Desierto. NO OPERAR.`,blocker:true,sp$:spD,spPct}; if(spD<0.15) return {pts:.5,max:.5,level:"ÓPTIMO",color:C.green,reason:`Spread $${spD.toFixed(2)}${!isNaN(o)?` · OI=${o}`:""}. Liquidez excelente.`,sp$:spD,spPct}; if(spD<=0.35&&(isNaN(o)||o>=50)) return {pts:.25,max:.5,level:"ACEPTABLE",color:C.yellow,reason:`Spread $${spD.toFixed(2)}${!isNaN(o)?` · OI=${o}`:""}. Liquidez aceptable.`,sp$:spD,spPct}; if(spD<=0.35&&!isNaN(o)&&o<50) return {pts:0,max:.5,level:"MALO",color:C.red,reason:`Spread $${spD.toFixed(2)} · OI=${o} bajo. Cuidado al entrar/salir.`,sp$:spD,spPct}; return {pts:0,max:.5,level:"MALO",color:C.red,reason:`Spread $${spD.toFixed(2)} ancho${!isNaN(o)?` · OI=${o}`:""}. Difícil operar.`,sp$:spD,spPct}; },
  p50: v => { const n=parseFloat(v); if(isNaN(n)) return {pts:0,max:1.5,level:"—",color:C.textMuted,reason:""}; if(n>=75) return {pts:1.5,max:1.5,level:"ÓPTIMO",color:C.green,reason:`P50 ${n}% excelente. Alta probabilidad de alcanzar el 50% del crédito.`}; if(n>=60) return {pts:.75,max:1.5,level:"ACEPTABLE",color:C.yellow,reason:`P50 ${n}% moderado. Probabilidad aceptable.`}; return {pts:0,max:1.5,level:"MALO",color:C.red,reason:`P50 ${n}% bajo. Pocas probabilidades de alcanzar el 50% del beneficio.`}; },
  pop: v => { const n=parseFloat(v); if(isNaN(n)) return {pts:0,max:1,level:"—",color:C.textMuted,reason:""}; if(n>=75) return {pts:1,max:1,level:"ÓPTIMO",color:C.green,reason:`POP ${n}% — alta probabilidad de que la put expire OTM (que no te asignen).`}; if(n>=50) return {pts:.5,max:1,level:"ACEPTABLE",color:C.yellow,reason:`POP ${n}% — probabilidad moderada de que la put expire OTM (que no te asignen).`}; return {pts:0,max:1,level:"MALO",color:C.red,reason:`POP ${n}% — probabilidad baja de que la put expire OTM (que no te asignen). Riesgo de asignación alto.`}; },
  bp: v => { const n=parseFloat(v); if(isNaN(n)) return {pts:0,max:1,level:"—",color:C.textMuted,reason:""}; if(n>50) return {pts:0,max:1,level:"BLOQUEANTE",color:C.red,reason:`BP ${n.toFixed(1)}% >50%. Regla Borja. NO OPERAR.`,blocker:true}; if(n<=30) return {pts:1,max:1,level:"ÓPTIMO",color:C.green,reason:`BP ${n.toFixed(1)}% amplio. Capital protegido.`}; return {pts:.5,max:1,level:"ACEPTABLE",color:C.yellow,reason:`BP ${n.toFixed(1)}% precaución. No abrir más posiciones.`}; },
  hour: () => { const h=new Date().getHours(),m=new Date().getMinutes(),t=`${h}:${String(m).padStart(2,"0")}h`; if(h>=17&&h<20) return {pts:0,max:0,level:"INFO",color:C.green,reason:`${t} — HORA ÓPTIMA. NY lleva 1-4h abierto. Spreads estrechos + volumen alto = tu orden al MID se ejecuta bien. La volatilidad de apertura ya se ha trasladado a las primas pero los precios se han estabilizado. Mejor equilibrio prima/ejecución.`}; if(h>=15&&h<17) return {pts:0,max:0,level:"INFO",color:C.yellow,reason:`${t} — APERTURA NY (15:30-17:00h). Máxima volatilidad del día = primas más altas para vender (nos beneficia como vendedores). PERO spreads más anchos y precios moviéndose rápido → tu orden al MID puede tardar en ejecutarse o hacerlo a peor precio. Si la prima es muy buena, puede merecer la pena. Si no, espera a las 17h.`}; if(h>=20&&h<22) return {pts:0,max:0,level:"INFO",color:C.yellow,reason:`${t} — CIERRE NY (20:00-22:00h). Volumen decreciente, market makers retirando liquidez. Primas pueden bajar ligeramente respecto a la sesión. Operable pero menos actividad.`}; return {pts:0,max:0,level:"INFO",color:C.red,reason:`${t} — MERCADO CERRADO. NYSE: 15:30-22:00h España. Fuera de horario no se ejecutan órdenes. Se quedan en Working hasta mañana.`}; },
  ror: (rc,dte) => { const r=parseFloat(rc),d=parseInt(dte); if(isNaN(r)||isNaN(d)||d===0) return {pts:0,max:0,level:"—",color:C.textMuted,reason:"",ann:null}; const a=r*365/d; if(a>=40) return {pts:0,max:0,level:"INFO",color:C.green,reason:`RoR ciclo ${r.toFixed(2)}% → anualizado ${a.toFixed(1)}%. Retorno excelente.`,ann:a}; if(a>=25) return {pts:0,max:0,level:"INFO",color:C.green,reason:`RoR ciclo ${r.toFixed(2)}% → anualizado ${a.toFixed(1)}%. Buen retorno.`,ann:a}; if(a>=15) return {pts:0,max:0,level:"INFO",color:C.yellow,reason:`RoR ciclo ${r.toFixed(2)}% → anualizado ${a.toFixed(1)}%. Retorno modesto.`,ann:a}; return {pts:0,max:0,level:"INFO",color:C.red,reason:`RoR ciclo ${r.toFixed(2)}% → anualizado ${a.toFixed(1)}%. Prima baja para el capital inmovilizado.`,ann:a}; },
  bonus: b => b?{pts:0,max:0,level:"⚠️ BLOQUEANTE",color:C.red,reason:"Hay al menos un factor bloqueante activo. Veredicto: NO OPERAR independientemente del score."}:{pts:0,max:0,level:"✅ OK",color:C.green,reason:"Sin factores bloqueantes. Todos los datos son coherentes."},
};

const Fld=({label,children})=><div style={{marginBottom:10}}><label style={{fontSize:11,fontWeight:600,color:C.textSec,marginBottom:4,display:"block",textTransform:"uppercase",letterSpacing:".3px"}}>{label}</label>{children}</div>;
const Inp=({label,value,onChange,placeholder,suffix})=><Fld label={label}><div style={{position:"relative"}}><input type="text" value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{width:"100%",padding:"9px 10px",borderRadius:7,border:`1px solid ${C.border}`,fontSize:14,color:C.text,background:C.bg,outline:"none",boxSizing:"border-box"}} />{suffix&&<span style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",color:C.textMuted,fontSize:12}}>{suffix}</span>}</div></Fld>;

function PutFlowV4(){
  const [step,setStep]=useState("welcome");
  const [imgs,setImgs]=useState([null,null,null]);
  const [prevs,setPrevs]=useState([null,null,null]);
  const [extracting,setExtracting]=useState(false);
  const [log,setLog]=useState("");
  const [err,setErr]=useState("");
  const [f,setF]=useState({market:"",chg:"",stars:0,ivRank:"",ivx:"",em:"",precio:"",dte:"",contract:"",delta:"",bid:"",ask:"",oi:"",p50:"",pop:"",bp:"",ror:"",strike:"",netLiq:"",theta:"",bpEff:"",maxProfit:""});
  const [results,setResults]=useState(null);
  const fRefs=[useRef(),useRef(),useRef()];
  const slot=useRef(0);
  const upd=(k,v)=>setF(p=>({...p,[k]:v}));

  useEffect(()=>{
    const h=e=>{if(step!=="captures")return;const items=e.clipboardData?.items;if(!items)return;for(const it of items){if(it.type.startsWith("image/")){const file=it.getAsFile();const idx=slot.current;loadImg(idx,file);setImgs(prev=>{const nx=[0,1,2].find(i=>i>idx&&!prev[i]);if(nx!==undefined)slot.current=nx;else{const empty=[0,1,2].find(i=>i!==idx&&!prev[i]);if(empty!==undefined)slot.current=empty;}return prev;});break;}}};
    window.addEventListener("paste",h);return()=>window.removeEventListener("paste",h);
  },[step]);

  function loadImg(i,file){setImgs(prev=>{const ni=[...prev];ni[i]=file;return ni});const r=new FileReader();r.onload=e=>{setPrevs(prev=>{const np=[...prev];np[i]=e.target.result;return np})};r.readAsDataURL(file);}
  function handleDrop(i,e){e.preventDefault();const file=e.dataTransfer.files?.[0];if(file?.type.startsWith("image/"))loadImg(i,file);}

  async function imgB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file)});}
  async function callAPI(prompt,file){const b64=await imgB64(file);const resp=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:file.type||"image/png",data:b64}},{type:"text",text:prompt}]}]})});if(!resp.ok)throw new Error(`API ${resp.status}`);const data=await resp.json();const txt=data.content?.map(c=>c.text||"").join("")||"";return JSON.parse(txt.replace(/```json|```/g,"").trim());}

  async function extractAll(){
    setExtracting(true);setErr("");setLog("");
    try{
      if(imgs[0]){setLog("📸 1/3 Quick Chart...");const d=await callAPI(P1,imgs[0]);if(d.precio)upd("precio",String(d.precio));if(d.chg!=null)upd("chg",String(d.chg));if(d.ivRank)upd("ivRank",String(d.ivRank));if(d.stars)upd("stars",d.stars);if(d.ivInd)upd("ivx",String(d.ivInd));}
      if(imgs[1]){setLog("📸 2/3 Chart ampliado...");const d=await callAPI(P2,imgs[1]);if(d.tendencia)upd("market",d.tendencia);if(d.bp)upd("bp",String(d.bp));if(d.netLiq)upd("netLiq",String(d.netLiq));}
      if(imgs[2]){setLog("📸 3/3 Cadena opciones...");const d=await callAPI(P3,imgs[2]);if(d.dte)upd("dte",String(d.dte));if(d.ivx)upd("ivx",String(d.ivx));if(d.em)upd("em",String(d.em));if(d.strike)upd("strike",String(d.strike));if(d.bid)upd("bid",String(d.bid));if(d.ask)upd("ask",String(d.ask));if(d.delta)upd("delta",String(Math.abs(d.delta)));if(d.p50)upd("p50",String(d.p50));if(d.pop)upd("pop",String(d.pop));if(d.theta)upd("theta",String(d.theta));if(d.bpEff)upd("bpEff",String(d.bpEff));if(d.maxProfit)upd("maxProfit",String(d.maxProfit));if(d.ror)upd("ror",String(d.ror));if(d.contract)upd("contract",d.contract);if(d.bp&&!f.bp)upd("bp",String(d.bp));if(d.netLiq&&!f.netLiq)upd("netLiq",String(d.netLiq));}
      setLog("✅ Extracción completada. Revisa y completa.");setStep("form");
    }catch(e){setErr(`Error: ${e.message}`);setStep("form");}finally{setExtracting(false);}
  }

  function runAnalysis(){
    const r={};r.market=sc.market(f.market);r.chg=sc.chg(f.chg);r.stars=sc.stars(f.stars);r.ivRank=sc.ivRank(f.ivRank);r.ivx=sc.ivx(f.ivx);r.em=sc.em(f.precio,f.em,f.strike);r.dte=sc.dte(f.dte);r.contract=sc.contract(f.contract);r.delta=sc.delta(f.delta,f.market);r.liq=sc.liq(f.oi,f.bid,f.ask);r.p50=sc.p50(f.p50);r.pop=sc.pop(f.pop);r.bp=sc.bp(f.bp);r.hour=sc.hour();r.ror=sc.ror(f.ror,f.dte);
    const blk=Object.values(r).some(v=>v.blocker);r.bonus=sc.bonus(blk);

        {f.market&&f.market!=="crash"&&<>
          <div style={{background:C.card,borderRadius:10,border:`1px solid ${C.border}`,padding:14,marginBottom:8}}><Inp label="Chg% Día" value={f.chg} onChange={v=>upd("chg",v)} placeholder="-1.30" suffix="%" /></div>
          <div style={{margin:"12px 0 8px",padding:"8px 14px",borderRadius:8,background:C.greenBg,display:"flex",alignItems:"center",gap:8,fontSize:13,fontWeight:700}}>FASE 2—ACTIVO<span style={{marginLeft:"auto",fontSize:11,fontWeight:400,opacity:.7}}>2.0pts</span></div>
          <div style={{background:C.card,borderRadius:10,border:`1px solid ${C.border}`,padding:14,marginBottom:8}}>
            <Fld label="Estrellas Liquidez"><div style={{display:"flex",gap:4}}>{[1,2,3,4].map(i=><span key={i} style={{fontSize:22,cursor:"pointer",color:i<=f.stars?"#F59E0B":C.border}} onClick={()=>upd("stars",i)}>★</span>)}</div></Fld>
            <div style={{display:"flex",gap:8}}><div style={{flex:1}}><Inp label="IV Rank" value={f.ivRank} onChange={v=>upd("ivRank",v)} placeholder="86.7" suffix="%" /></div><div style={{flex:1}}><Inp label="IVx Venc." value={f.ivx} onChange={v=>upd("ivx",v)} placeholder="24.3" suffix="%" /></div></div>
            <div style={{display:"flex",gap:8}}><div style={{flex:1}}><Inp label="Precio" value={f.precio} onChange={v=>upd("precio",v)} placeholder="79.13" /></div><div style={{flex:1}}><Inp label="Exp.Move±" value={f.em} onChange={v=>upd("em",v)} placeholder="4.31" /></div></div>
            {f.precio&&f.em&&<div style={{fontSize:11,color:C.blue,fontWeight:600}}>📍 Strike sug: ≤{(parseFloat(f.precio)-parseFloat(f.em)).toFixed(1)}</div>}
          </div>
          <div style={{margin:"12px 0 8px",padding:"8px 14px",borderRadius:8,background:C.yellowBg,display:"flex",alignItems:"center",gap:8,fontSize:13,fontWeight:700}}>FASE 3—STRIKE<span style={{marginLeft:"auto",fontSize:11,fontWeight:400,opacity:.7}}>6.0pts</span></div>
          <div style={{background:C.card,borderRadius:10,border:`1px solid ${C.border}`,padding:14,marginBottom:8}}>
            <div style={{display:"flex",gap:8}}><div style={{flex:1}}><Inp label="Strike" value={f.strike} onChange={v=>upd("strike",v)} placeholder="77" /></div><div style={{flex:1}}><Inp label="DTE" value={f.dte} onChange={v=>upd("dte",v)} placeholder="40" suffix="d" /></div></div>
            <Fld label="Tipo Venc."><select style={{width:"100%",padding:"9px 10px",borderRadius:7,border:`1px solid ${C.border}`,fontSize:14,color:C.text,background:C.bg,cursor:"pointer",boxSizing:"border-box"}} value={f.contract} onChange={e=>upd("contract",e.target.value)}><option value="">—</option><option value="mensual">Mensual (S)</option><option value="weekly">Weekly (W)</option><option value="trimestral">Trimestral (Q)</option></select></Fld>
            <Inp label="Delta" value={f.delta} onChange={v=>upd("delta",v)} placeholder="25.3" suffix="Δ" />
            {f.delta&&f.market&&MKT[f.market]?.delta&&(()=>{const d=Math.abs(parseFloat(f.delta)),[lo,hi]=MKT[f.market].delta,ok=d>=lo&&d<=hi;return <div style={{fontSize:11,color:ok?C.green:C.yellow,fontWeight:600,marginTop:-6,marginBottom:6}}>{ok?"✅":"⚠️"} Rango {MKT[f.market].label}: {lo}-{hi}</div>})()}
          </div>
          <div style={{background:C.card,borderRadius:10,border:`1px solid ${C.border}`,padding:14,marginBottom:8}}>
            <div style={{display:"flex",gap:8}}><div style={{flex:1}}><Inp label="Bid" value={f.bid} onChange={v=>upd("bid",v)} placeholder="1.35" /></div><div style={{flex:1}}><Inp label="Ask" value={f.ask} onChange={v=>upd("ask",v)} placeholder="1.70" /></div><div style={{flex:1}}><Inp label="OI" value={f.oi} onChange={v=>upd("oi",v)} placeholder="76" /></div></div>
            {f.bid&&f.ask&&(()=>{const sp=Math.abs(parseFloat(f.ask)-parseFloat(f.bid)),mid=(parseFloat(f.bid)+parseFloat(f.ask))/2;return <div style={{fontSize:11,color:C.textSec}}>Spread: ${sp.toFixed(2)} ({(sp/mid*100).toFixed(1)}%) · Mid: ${mid.toFixed(2)}</div>})()}
            <div style={{display:"flex",gap:8,marginTop:6}}><div style={{flex:1}}><Inp label="P50" value={f.p50} onChange={v=>upd("p50",v)} placeholder="80" suffix="%" /></div><div style={{flex:1}}><Inp label="POP" value={f.pop} onChange={v=>upd("pop",v)} placeholder="72" suffix="%" /></div></div>
          </div>
          <div style={{margin:"12px 0 8px",padding:"8px 14px",borderRadius:8,background:C.bg,border:`1px solid ${C.border}`,display:"flex",alignItems:"center",gap:8,fontSize:13,fontWeight:700}}>FASE 4—VIABILIDAD<span style={{marginLeft:"auto",fontSize:11,fontWeight:400,opacity:.7}}>1.0pts</span></div>
          <div style={{background:C.card,borderRadius:10,border:`1px solid ${C.border}`,padding:14,marginBottom:8}}>
            <Inp label="BP Usage %" value={f.bp} onChange={v=>upd("bp",v)} placeholder="24.6" suffix="%" />
            <Inp label="RoR ciclo (Tastytrade)" value={f.ror} onChange={v=>upd("ror",v)} placeholder="1.97" suffix="%" />
            {f.ror&&f.dte&&(()=>{const a=parseFloat(f.ror)*365/parseInt(f.dte);return !isNaN(a)?<div style={{fontSize:11,color:C.blue,fontWeight:600,marginTop:-6}}>📈 Anualizado: {a.toFixed(1)}%</div>:null})()}
          </div>
          <div style={{background:C.card,borderRadius:10,border:`1px solid ${C.border}`,padding:14,marginBottom:8}}>
            <div style={{fontSize:11,fontWeight:600,color:C.textMuted,marginBottom:6,textTransform:"uppercase"}}>Opcionales</div>
            <div style={{display:"flex",gap:8}}><div style={{flex:1}}><Inp label="NetLiq" value={f.netLiq} onChange={v=>upd("netLiq",v)} placeholder="23225" /></div><div style={{flex:1}}><Inp label="Theta" value={f.theta} onChange={v=>upd("theta",v)} placeholder="2.9" /></div></div>
            <div style={{display:"flex",gap:8}}><div style={{flex:1}}><Inp label="BP Eff" value={f.bpEff} onChange={v=>upd("bpEff",v)} placeholder="1765" /></div><div style={{flex:1}}><Inp label="Max Profit" value={f.maxProfit} onChange={v=>upd("maxProfit",v)} placeholder="152" /></div></div>
          </div>
          <button style={{width:"100%",padding:14,borderRadius:10,border:"none",background:C.accent,color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer",marginTop:12,opacity:canRun?1:.4}} onClick={canRun?runAnalysis:undefined}>🔍 ANALIZAR {f.strike?`${f.strike}P`:""}</button>
        </>}
        <button style={{width:"100%",padding:10,borderRadius:8,border:`1px solid ${C.border}`,background:C.card,color:C.textSec,fontSize:13,fontWeight:600,cursor:"pointer",marginTop:8}} onClick={()=>setStep("captures")}>📸 Capturas</button>
        <button style={{width:"100%",padding:10,borderRadius:8,border:`1px solid ${C.border}`,background:C.card,color:C.textSec,fontSize:13,fontWeight:600,cursor:"pointer",marginTop:4}} onClick={()=>setStep("welcome")}>← Inicio</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(PutFlowV4));
</script>
</body>
</html>
